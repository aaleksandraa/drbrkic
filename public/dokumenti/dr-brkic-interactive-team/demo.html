<!doctype html>
<html lang="bs">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Interaktivni tim — Dr Brkić</title>
<style>
*{box-sizing:border-box}
body{margin:0;padding:32px;background:#f4f6f4;color:#15211b;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
.demo-shell{max-width:1500px;margin:auto}
.demo-head{display:flex;justify-content:space-between;gap:20px;align-items:end;margin-bottom:18px}
.demo-head h1{font-size:clamp(24px,3vw,44px);margin:0;letter-spacing:-.04em}
.demo-head p{margin:0;color:#68736d;max-width:630px;line-height:1.55}
.interactive-team {
  --team-radius: 26px;
  --team-card-bg: rgba(255, 255, 255, 0.92);
  --team-card-border: rgba(255, 255, 255, 0.68);
  --team-ink: #15211b;
  --team-muted: #647069;
  --team-accent: #2e7d5b;
  width: 100%;
}

.interactive-team__stage {
  position: relative;
  overflow: hidden;
  border-radius: var(--team-radius);
  background: #eceeea;
  isolation: isolate;
}

.interactive-team__svg {
  display: block;
  width: 100%;
  height: auto;
  aspect-ratio: 2048 / 1365;
}

.interactive-team__base-image {
  transition: filter 420ms cubic-bezier(.2,.75,.2,1), opacity 420ms ease;
  will-change: filter;
}

.interactive-team--active .interactive-team__base-image {
  filter: grayscale(1) saturate(0) brightness(.88) contrast(.96);
}

.interactive-team__active-image {
  pointer-events: none;
  filter: saturate(1.06) contrast(1.035) brightness(1.02);
  animation: team-person-in 260ms cubic-bezier(.2,.8,.2,1) both;
}

@keyframes team-person-in {
  from { opacity: 0; }
  to { opacity: 1; }
}

.interactive-team__person {
  outline: none;
  cursor: default;
}

.interactive-team__person[role='link'] {
  cursor: pointer;
}

.interactive-team__hit-polygon {
  fill: rgba(255,255,255,.001);
  stroke: transparent;
  stroke-width: 3;
  pointer-events: all;
  transition: fill 160ms ease, stroke 160ms ease;
}

.interactive-team__hit-polygon[data-debug='true'] {
  fill: rgba(46, 125, 91, .18);
  stroke: rgba(46, 125, 91, .95);
}

.interactive-team__person:focus-visible .interactive-team__hit-polygon {
  stroke: rgba(255,255,255,.95);
  stroke-width: 5;
}

.interactive-team__debug-number {
  pointer-events: none;
  fill: #fff;
  stroke: #111;
  stroke-width: 5px;
  paint-order: stroke;
  font: 700 30px/1 system-ui, sans-serif;
}

.interactive-team__card {
  position: absolute;
  z-index: 5;
  min-width: min(260px, 34vw);
  max-width: min(340px, 38vw);
  padding: 16px 18px 15px;
  border: 1px solid var(--team-card-border);
  border-radius: 16px;
  background: var(--team-card-bg);
  color: var(--team-ink);
  box-shadow: 0 18px 55px rgba(18, 32, 25, .18);
  backdrop-filter: blur(15px) saturate(1.1);
  -webkit-backdrop-filter: blur(15px) saturate(1.1);
  animation: team-card-in 180ms ease-out both;
  transform-origin: 50% 100%;
}

.interactive-team__card--left {
  transform: translate(12px, -50%);
}

.interactive-team__card--center {
  transform: translate(-50%, calc(-100% - 16px));
}

.interactive-team__card--right {
  transform: translate(calc(-100% - 12px), -50%);
}

@keyframes team-card-in {
  from { opacity: 0; translate: 0 7px; }
  to { opacity: 1; translate: 0 0; }
}

.interactive-team__card-kicker {
  margin-bottom: 5px;
  color: var(--team-accent);
  font: 700 10px/1.1 system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  letter-spacing: .14em;
}

.interactive-team__card-name {
  font: 700 clamp(15px, 1.35vw, 20px)/1.18 system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  letter-spacing: -.015em;
}

.interactive-team__card-title {
  margin-top: 4px;
  color: var(--team-muted);
  font: 500 clamp(12px, .95vw, 14px)/1.35 system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
}

.interactive-team__card-link {
  display: inline-flex;
  gap: 7px;
  align-items: center;
  margin-top: 11px;
  color: var(--team-accent);
  text-decoration: none;
  font: 700 12px/1 system-ui, sans-serif;
}

.interactive-team__card-link span {
  transition: transform 180ms ease;
}

.interactive-team__card-link:hover span {
  transform: translateX(3px);
}

.interactive-team__mobile-help {
  display: none;
  margin: 10px 2px 0;
  color: #6b746f;
  font: 500 12px/1.4 system-ui, sans-serif;
}

@media (hover: none), (pointer: coarse) {
  .interactive-team__mobile-help {
    display: block;
  }

  .interactive-team__card {
    min-width: 190px;
    max-width: min(260px, 72vw);
    padding: 12px 14px;
    border-radius: 13px;
  }

  .interactive-team__card-name {
    font-size: 14px;
  }

  .interactive-team__card-title {
    font-size: 11px;
  }
}

@media (max-width: 720px) {
  .interactive-team {
    --team-radius: 18px;
  }

  .interactive-team__stage {
    /* Keep the whole team visible on mobile. If faces become too small,
       replace this with a horizontally-scrollable variant. */
    overflow: hidden;
  }
}

@media (prefers-reduced-motion: reduce) {
  .interactive-team__base-image,
  .interactive-team__active-image,
  .interactive-team__card,
  .interactive-team__card-link span {
    animation: none !important;
    transition: none !important;
  }
}

</style>
</head>

      '1848,449 1812,457 1787,483 1786,522 1800,560 1830,580 1863,574 1891,548 1894,510 1881,471 1872,461',
      '1796,564 1870,560 1908,596 1922,658 1920,751 1919,849 1918,948 1912,1045 1906,1124 1898,1171 1880,1204 1852,1221 1819,1212 1797,1183 1786,1116 1782,1022 1783,925 1785,828 1788,729 1792,629',
    ],
    label: { x: 1905, y: 690, side: 'right' },
  },
];
const IMAGE='./public/images/cijeli-tim-unutar.jpg';
const stage=document.querySelector('.interactive-team');
const svg=document.getElementById('teamSvg');
const cardHost=document.getElementById('teamCard');
const NS='http://www.w3.org/2000/svg';
let active=null;
function el(name, attrs={}){ const n=document.createElementNS(NS,name); Object.entries(attrs).forEach(([k,v])=>n.setAttribute(k,v)); return n; }
const defs=el('defs'); svg.appendChild(defs);
members.forEach(m=>{
  const cp=el('clipPath',{id:'clip-'+m.id,clipPathUnits:'userSpaceOnUse'});
  m.maskPolygons.forEach(points=>cp.appendChild(el('polygon',{points})));
  defs.appendChild(cp);
});
const base=el('image',{href:IMAGE,x:0,y:0,width:2048,height:1365,preserveAspectRatio:'xMidYMid slice',class:'interactive-team__base-image'}); svg.appendChild(base);
const activeLayer=el('g'); svg.appendChild(activeLayer);
const hotspots=el('g',{class:'interactive-team__hotspots'}); svg.appendChild(hotspots);
function setActive(m){
  active=m;
  stage.classList.toggle('interactive-team--active',!!m);
  activeLayer.innerHTML=''; cardHost.innerHTML='';
  if(!m) return;
  const img=el('image',{href:IMAGE,x:0,y:0,width:2048,height:1365,preserveAspectRatio:'xMidYMid slice',class:'interactive-team__active-image','clip-path':'url(#clip-'+m.id+')'});
  activeLayer.appendChild(img);
  const card=document.createElement('div');
  card.className='interactive-team__card interactive-team__card--'+(m.label.side||'center');
  card.style.left=(m.label.x/2048*100)+'%'; card.style.top=(m.label.y/1365*100)+'%';
  card.innerHTML='<div class="interactive-team__card-kicker">NAŠ TIM</div><div class="interactive-team__card-name">'+m.name+'</div><div class="interactive-team__card-title">'+m.title+'</div>'+(m.profileUrl?'<a class="interactive-team__card-link" href="'+m.profileUrl+'">Pogledaj profil <span>→</span></a>':'');
  cardHost.appendChild(card);
}
members.forEach(m=>{
  const g=el('g',{class:'interactive-team__person',tabindex:'0',role:m.profileUrl?'link':'button','aria-label':m.name+', '+m.title});
  m.hitPolygons.forEach(points=>g.appendChild(el('polygon',{points,class:'interactive-team__hit-polygon'})));
  g.addEventListener('mouseenter',()=>setActive(m));
  g.addEventListener('focus',()=>setActive(m));
  g.addEventListener('blur',()=>setActive(null));
  g.addEventListener('click',()=>{ if(m.profileUrl) location.href=m.profileUrl; else setActive(m); });
  g.addEventListener('keydown',e=>{ if(e.key==='Enter'||e.key===' '){e.preventDefault(); if(m.profileUrl) location.href=m.profileUrl; else setActive(m);} });
  hotspots.appendChild(g);
});
stage.addEventListener('mouseleave',()=>setActive(null));
</script>
</body>
</html>
